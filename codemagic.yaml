workflows:
  real-satisfaction-live:
    name: Real Satisfaction Handler Live
    max_build_duration: 10
    instance_type: linux
    environment:
      groups:
        - real_satisfaction_keys
      vars:
        VERIFY_TOKEN: "RealSatisfactionVerify2026"
    scripts:
      - name: Install
        script: |
          pip3 install -r requirements.txt
      - name: Test 8 Objectives
        script: |
          python3 -c "from app import ai_handler; print(ai_handler('post_draft', {'text': 'Tunza bunda afya', 'category': 'health', 'official_link': 'https://www.health.go.ke'})); print(ai_handler('incoming_comment', {'text': 'mjinga'}))"
      - name: Post to Page
        script: |
          python3 -c "from app import generate_post; print(generate_post('Budget 2026', 'politics'))"
    artifacts:
      - autopsy.log
