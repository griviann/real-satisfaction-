- name: Post to Page
  script: |
    python3 << 'PY'
    import os, requests
    token = os.getenv('FB_PAGE_ACCESS_TOKEN')
    page_id = os.getenv('FB_PAGE_ID')
    text = "Tunza afya Budget 2026 https://www.iebc.or.ke"
    url = f"https://graph.facebook.com/{page_id}/feed"
    r = requests.post(url, data={"message": text, "access_token": token, "link": "https://www.iebc.or.ke"})
    print(r.text)
    PY
