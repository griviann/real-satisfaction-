workflows:
  android-apk:
    name: Real Satisfaction Android Only
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Ensure Android folder
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name real_satisfaction
          fi
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/*.apk
