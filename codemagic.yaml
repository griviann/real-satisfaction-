workflows:
  android-workflow:
    name: Real Satisfaction APK v2.2
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          flutter create . --platforms=android --project-name real_satisfaction
          flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
