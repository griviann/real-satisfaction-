workflows:
  android-apk:
    name: Real Satisfaction Android Only
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter clean
          flutter pub get
      - name: Ensure Android folder exists
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/apk/release/app-release.apk
  real-satisfaction-live:
    name: Real Satisfaction Handler Live
    instance_type: linux_x2
    max_build_duration: 20
    environment:
      groups:
                - real_satisfaction_keys
      vars:
        VERIFY_TOKEN: "RealSatisfactionVerify2026"
      python: "3.11"
    scripts:
            - name: Install
        script: pip install -r requirements.txt
            - name: Test 8 Objectives
        script: |
          python -c "from app import ai_handler; print(ai_handler('post_draft', {'text': 'Tunza bunda afya', 'category': 'health', 'official_link': 'https://www.health.go.ke'})); print(ai_handler('incoming_comment', {'text': 'mjinga'}))"
            - name: Post to Page
        script: python -c "from app import generate_post; print(generate_post('Budget 2026', 'politics'))"
    artifacts:
            - autopsy.log
