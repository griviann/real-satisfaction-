name: RealSatisfaction Bot
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
concurrency:
  group: fb-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -u app.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
